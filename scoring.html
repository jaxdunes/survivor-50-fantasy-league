    function initializeApp() {
        const { createElement: h, useState, useMemo, Fragment, useEffect } = React;
        
        const createIcon = (svgContent) => {

                fill: 'none',
                stroke: 'currentColor',
                strokeWidth: 2,
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                dangerouslySetInnerHTML: { __html: svgContent }
            });
        };
        
        const Icons = {
            Trophy: createIcon('<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path>'),

            Award: createIcon('<circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>'),
            X: createIcon('<path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>'),
            ChevronDown: createIcon('<polyline points="6 9 12 15 18 9"></polyline>'),
            Home: createIcon('<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline>'),
            Menu: createIcon('<line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line>'),
            Check: createIcon('<polyline points="20 6 9 17 4 12"></polyline>')
        };
        
        function ScoringPage() {
            const currentLeagueConfig = LEAGUES_DATA[activeLeagueId] || LEAGUES_DATA['jackson-ryan-league'];
            const seasonConfig = (currentLeagueConfig.seasons || []).find(s => s.id === activeSeasonId) || {};
            const teams = seasonConfig.teams || currentLeagueConfig.teams;
            
            const defaultPlayers = [
                { id: 1, name: "Aaliyah Puglia" },
                { id: 2, name: "Alexis Levine" },
                { id: 3, name: "An “Thien An” Nguyen" },
                { id: 4, name: "Ana Sani" },
                { id: 5, name: "Angelica “Jelly” Loblack" },
                { id: 6, name: "Brady Booker" },
                { id: 7, name: "Carter Krull" },
                { id: 8, name: "Cristian Chavez" },
                { id: 9, name: "Danny “Kilby” Kilby" },
                { id: 10, name: "Devin Way" }
            ];
            
            const scoringCategories = [
                // First to Drop
                { id: 'solo-immunity', name: 'Wins Solo Immunity', points: 25, category: 'First to Drop' },
                { id: 'tribe-immunity', name: 'Wins Tribe Immunity', points: 15, category: 'First to Drop' },
                { id: 'tribe-immunity-second', name: 'Second Place Tribe Immunity', points: 10, category: 'First to Drop' },
                { id: 'tribe-reward', name: 'Wins Tribe Reward', points: 10, category: 'First to Drop' },
                { id: 'tribe-reward-second', name: 'Second Place Tribe Reward', points: 5, category: 'First to Drop' },
                { id: 'solo-reward', name: 'Wins Solo Reward', points: 15, category: 'First to Drop' },
                { id: 'reward-pick', name: 'Chosen to Go On Reward', points: 3, category: 'First to Drop' },
                { id: 'first-to-drop', name: 'First to Drop', points: -2, category: 'First to Drop' },
                { id: 'made-merge', name: 'Makes It to the Merge', points: 10, category: 'First to Drop' },
                
                // Gameplay
                { id: 'showmance-start', name: 'Starts a Showmance', points: 5, category: 'Gameplay' },
                { id: 'showmance-end', name: 'Ends a Showmance', points: -3, category: 'Gameplay' },
                { id: 'finds-idol', name: 'Finds a Hidden Immunity Idol', points: 10, category: 'Gameplay' },
                { id: 'named-alliance', name: 'Makes a named alliance', points: 5, category: 'Gameplay' },
                { id: 'makes-jury', name: 'Makes It to Jury', points: 10, category: 'Gameplay' },
                
                // Tribal Council
                { id: 'uses-idol-self', name: 'Uses Hidden Immunity Idol On Self', points: 5, category: 'Tribal Council' },
                { id: 'uses-idol-correctly', name: 'Uses Hidden Immunity Idol Correctly', points: 5, category: 'Tribal Council' },
                { id: 'uses-idol-ally', name: 'Uses Hidden Immunity Idol On Somebody Else', points: 3, category: 'Tribal Council' },
                { id: 'idol-used-them', name: 'Has Hidden Immunity Idol Used On Them', points: 5, category: 'Tribal Council' },
                { id: 'voted-out', name: 'Gets Voted Out', points: -25, category: 'Tribal Council' },
                { id: 'votes-survived', name: 'Gets Votes and Survives (0.5 × # of votes)', points: 0.5, category: 'Tribal Council' },
                { id: 'pulls-rock', name: 'Pulls a Rock', points: 1, category: 'Tribal Council' },
                { id: 'first-voted-out', name: 'First Voted Out', points: -10, category: 'Tribal Council' },
                { id: 'wins-fire', name: 'Wins Fire Making Challenge', points: 5, category: 'Tribal Council' },
                { id: 'shot-dark-correct', name: 'Plays shot in the dark correctly', points: 15, category: 'Tribal Council' },
                { id: 'voted-idol-pocket', name: 'Voted out with idol in pocket', points: -10, category: 'Tribal Council' },
                { id: 'lost-vote', name: 'Does not have a vote during tribal (including stolen votes)', points: -5, category: 'Tribal Council' },
                
                // Misc.
                { id: 'hashtag', name: 'Inspires an on-screen hashtag', points: 1, category: 'Misc.' },
                { id: 'mentions-prev-player', name: 'Mentions a Player from a Previous Season', points: -1, category: 'Misc.' },
                { id: 'names-episode', name: 'Says the title of the episode', points: 10, category: 'Misc.' },
                
                // Emotions
                { id: 'camp-meeting', name: 'Calls a Camp Meeting to Confront Someone', points: -5, category: 'Emotions' },
                { id: 'yelling-match', name: 'Gets in a Yelling Match', points: -5, category: 'Emotions' },
                { id: 'confessional-tears', name: 'Cries in Confessional', points: -1, category: 'Emotions' },
                { id: 'public-tears', name: 'Cries in Front of Player', points: -3, category: 'Emotions' },
                { id: 'expelled', name: 'Expelled from the Island', points: 25, category: 'Emotions' },
                { id: 'medevac', name: 'Medical Removed from Island', points: -25, category: 'Emotions' },
                
                // Advantages / Idols
                { id: 'voted-w-idol', name: 'Voted out with idol', points: -10, category: 'Advantages / Idols' },
                { id: 'voted-w-advantage', name: 'Voted out with advantage', points: -10, category: 'Advantages / Idols' },
                { id: 'finds-advantage', name: 'Finds a Special Power/Advantage', points: 5, category: 'Advantages / Idols' },
                { id: 'given-advantage', name: 'Is Given a Special Power from Somebody', points: 5, category: 'Advantages / Idols' },
                { id: 'uses-advantage-correct', name: 'Uses advantage correctly', points: 10, category: 'Advantages / Idols' },
                { id: 'fails-advantage', name: 'Fails the advantage challenge', points: -10, category: 'Advantages / Idols' },
                
                // End of Season
                { id: 'most-votes', name: 'Most votes against at end of season', points: 15, category: 'End of Season' },
                { id: 'least-votes', name: 'Least votes against (Post-Merge)', points: 15, category: 'End of Season' },
                { id: 'most-immunities', name: 'Most individual immunities won', points: 20, category: 'End of Season' },
                { id: 'most-idols-found', name: 'Most idols/advantages found', points: 20, category: 'End of Season' },
                { id: 'sole-survivor', name: 'Sole Survivor', points: 75, category: 'End of Season' },
                { id: 'runner-up', name: 'Runner-ups', points: 25, category: 'End of Season' }
            ];
            
            const [playerTeams, setPlayerTeams] = useState({});
            const [seasonData, setSeasonData] = useState(null);
            const [scores, setScores] = useState({});
            const [eliminationOrder, setEliminationOrder] = useState({});
            const [winner, setWinner] = useState(null); // Single winner ID
            const [currentEpisode, setCurrentEpisode] = useState(1);
            const [showRules, setShowRules] = useState(false);
            const [showAddScore, setShowAddScore] = useState(false);
            const [showMarkElimination, setShowMarkElimination] = useState(false);
            const [showMarkWinner, setShowMarkWinner] = useState(false);
            const [showSideMenu, setShowSideMenu] = useState(false);
            const [expandedTeams, setExpandedTeams] = useState({});
            const [selectedAddScoreLeagues, setSelectedAddScoreLeagues] = useState(Object.keys(LEAGUES_DATA));
            const [categorySearchTerm, setCategorySearchTerm] = useState('');
            const [selectedCategoryId, setSelectedCategoryId] = useState('');
            const [rulesSearchTerm, setRulesSearchTerm] = useState('');
            
            useEffect(() => {
                if (showAddScore) {
                    setSelectedAddScoreLeagues(Object.keys(LEAGUES_DATA));
                    setCategorySearchTerm('');
                    setSelectedCategoryId('');
                }
            }, [showAddScore]);

            const filteredScoringCategories = useMemo(() => {
                if (!categorySearchTerm.trim()) return scoringCategories;
                const q = categorySearchTerm.toLowerCase();
                return scoringCategories.filter(cat => 
                    cat.name.toLowerCase().includes(q) || 
                    cat.category.toLowerCase().includes(q)
                );
            }, [categorySearchTerm, scoringCategories]);

            const groupedRules = useMemo(() => {
                const q = rulesSearchTerm.toLowerCase().trim();
                const filtered = !q ? scoringCategories : scoringCategories.filter(cat => 
                    cat.name.toLowerCase().includes(q) || 
                    cat.category.toLowerCase().includes(q)
                );
                const groups = {};
                filtered.forEach(cat => {
                    if (!groups[cat.category]) groups[cat.category] = [];
                    groups[cat.category].push(cat);
                });
                return groups;
            }, [rulesSearchTerm, scoringCategories]);
            
            // Load season preset data
            useEffect(() => {
                fetch('seasons/' + activeSeasonId + '.json')
                    .then(res => res.json())
                    .then(data => setSeasonData(data))
                    .catch(err => console.warn('Could not load season json in scoring', err));
            }, [activeSeasonId]);

            const players = (seasonData && seasonData.contestants) ? seasonData.contestants : defaultPlayers;

            // Load data from Firebase
            useEffect(() => {
                if (!window.firebaseInitialized) {
                    const saved = localStorage.getItem(`survivor-teams-${activeLeagueId}-${activeSeasonId}`);
                    if (saved) {
                        setPlayerTeams(JSON.parse(saved));
                    }
                    const savedScores = localStorage.getItem(`survivor-scores-${activeLeagueId}-${activeSeasonId}`);
                    if (savedScores) {
                        setScores(JSON.parse(savedScores));
                    }
                    return;
                }
                
                const seasonBasePath = `leagues/${activeLeagueId}/seasons/${activeSeasonId}`;
                
                const teamsRef = database.ref(`${seasonBasePath}/teams`);
                teamsRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setPlayerTeams(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('leagues/jackson-ryan-league/teams').once('value').then(snap => {
                            if (snap.val()) setPlayerTeams(snap.val());
                            else database.ref('teams').once('value').then(legacySnap => setPlayerTeams(legacySnap.val() || {}));
                        });
                    } else {
                        setPlayerTeams({});
                    }
                });
                
                const scoresRef = database.ref(`${seasonBasePath}/scores`);
                scoresRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setScores(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('scores').once('value').then(snap => setScores(snap.val() || {}));
                    } else {
                        setScores({});
                    }
                });
                
                const elimRef = database.ref(`${seasonBasePath}/eliminationOrder`);
                elimRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setEliminationOrder(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('eliminationOrder').once('value').then(snap => setEliminationOrder(snap.val() || {}));
                    } else {
                        setEliminationOrder({});
                    }
                });
                
                const winnerRef = database.ref(`${seasonBasePath}/winner`);
                winnerRef.on('value', (snapshot) => {
                    const val = snapshot.val();
                    if (val) {
                        setWinner(val);
                    } else if (activeLeagueId === 'jackson-ryan-league' && activeSeasonId === 'season-50') {
                        database.ref('winner').once('value').then(snap => setWinner(snap.val() || null));
                    } else {
                        setWinner(null);
                    }
                });
                
                database.ref('currentEpisode').on('value', (snapshot) => {
                    setCurrentEpisode(snapshot.val() || 1);
                });
                
                return () => {
                    teamsRef.off();
                    scoresRef.off();
                    elimRef.off();
                    winnerRef.off();
                    database.ref('currentEpisode').off();
                };
            }, [activeLeagueId, activeSeasonId]);
            
            // Calculate team scores
            const getTeamScore = (teamId) => {
                const roster = players.filter(p => playerTeams[p.id] === teamId);
                let total = 0;
                
                roster.forEach(player => {
                    const playerScores = scores[player.id] || {};
                    Object.values(playerScores).forEach(episodeScores => {
                        Object.values(episodeScores).forEach(score => {
                            total += score.points || 0;
                        });
                    });
                    
                    // Add elimination bonus
                    if (eliminationOrder[player.id]) {
                        const episode = eliminationOrder[player.id];
                        total += episode; // Points = episode number (rewards longevity)
                    }
                });
                
                // Add winner bonus (20 points if winner is on this team)
                if (winner) {
                    const roster = players.filter(p => playerTeams[p.id] === teamId);

                                    h('button', {
                                        onClick: () => {
                                            if (!selectedAddScoreLeagues.length) {
                                                alert('Please select at least one league to apply points.');
                                                return;
                                            }
                                            
                                            const playerId = document.getElementById('player-select').value;
                                            const episode = document.getElementById('episode-select').value;
                                            const categoryId = document.getElementById('category-select').value;
                                            const points = parseInt(document.getElementById('points-input').value);
                                            const note = document.getElementById('note-input').value;
                                            
                                            if (!playerId || !episode || !categoryId || isNaN(points)) {
                                                alert('Please fill in all required fields');
                                                return;
                                            }
                                            
                                            const category = scoringCategories.find(c => c.id === categoryId);
                                            const scoreId = Date.now().toString();
                                            
                                            if (window.firebaseInitialized) {
                                                const promises = selectedAddScoreLeagues.map(leagueId => {
                                                    return database.ref(`leagues/${leagueId}/seasons/${activeSeasonId}/scores/${playerId}/${episode}/${scoreId}`).set({
                                                        category: category ? category.name : 'Custom',
                                                        points: points,
                                                        note: note || ''
                                                    });
                                                });
                                                
                                                Promise.all(promises).then(() => {
                                                    document.getElementById('player-select').value = '';
                                                    document.getElementById('episode-select').value = '';
                                                    document.getElementById('category-select').value = '';
                                                    document.getElementById('points-input').value = '';
                                                    document.getElementById('note-input').value = '';
                                                    setShowAddScore(false);
                                                    
                                                    const leagueNames = selectedAddScoreLeagues.map(id => (LEAGUES_DATA[id] || {}).name || id).join(', ');
                                                    alert(`Points added successfully to: ${leagueNames}! 🎉`);
                                                });
                                            } else {
                                                selectedAddScoreLeagues.forEach(leagueId => {
                                                    const key = `survivor-scores-${leagueId}-${activeSeasonId}`;
                                                    const existing = JSON.parse(localStorage.getItem(key) || '{}');
                                                    if (!existing[playerId]) existing[playerId] = {};
                                                    if (!existing[playerId][episode]) existing[playerId][episode] = {};
                                                    existing[playerId][episode][scoreId] = {
                                                        category: category ? category.name : 'Custom',
                                                        points: points,
                                                        note: note || ''
                                                    };
                                                    localStorage.setItem(key, JSON.stringify(existing));
                                                });
                                                setShowAddScore(false);
                                                alert('Points added locally to selected leagues!');
                                            }
                                        },
                                        className: 'w-full px-6 py-3 bg-gradient-to-r from-orange-500 to-amber-600 text-white rounded-xl font-bold hover:shadow-lg transition text-lg'
                                    }, 'Add Points')
                                )
                            )
                        )
                    ),
                    
                    // Mark Elimination Modal
                    showMarkElimination && h('div', { 
                        className: 'modal-backdrop',
                        onClick: () => setShowMarkElimination(false)
                    },
                        h('div', { 
                            className: 'modal-content',
                            onClick: (e) => e.stopPropagation(),
                            style: { maxWidth: '600px' }
                        },
                            h('div', { className: 'p-6' },
                                h('div', { className: 'flex justify-between items-center mb-6' },
                                    h('h2', { 
                                        className: 'text-3xl font-black',
                                        style: { fontFamily: '"Bebas Neue", cursive' }
                                    }, '❌ MARK ELIMINATION'),
                                    h('button', {
                                        onClick: () => setShowMarkElimination(false),
                                        className: 'text-gray-500 hover:text-gray-700'
                                    }, h(Icons.X, { size: 28 }))
                                ),
                                
                                // Show currently eliminated players with undo option
                                Object.keys(eliminationOrder).length > 0 && h('div', { className: 'mb-6 p-4 bg-red-50 border-2 border-red-200 rounded-xl' },
                                    h('h3', { className: 'font-bold mb-3 text-red-800' }, '👥 Currently Eliminated'),
                                    h('div', { className: 'space-y-2' },
                                        ...Object.entries(eliminationOrder).map(([playerId, episode]) => {
                                            const player = players.find(p => p.id === parseInt(playerId));
                                            return h('div', {
                                                key: playerId,
                                                className: 'flex justify-between items-center bg-white p-3 rounded-lg'
                                            },
                                                h('span', { className: 'font-semibold text-gray-900' }, 
                                                    `${player?.name || 'Unknown'} - Episode ${episode}`
                                                ),
                                                h('button', {
                                                    onClick: () => {
                                                        if (confirm(`Undo elimination for ${player?.name}?`)) {
                                                            database.ref(`leagues/${activeLeagueId}/seasons/${activeSeasonId}/eliminationOrder/${playerId}`).remove();
                                                        }
                                                    },
                                                    className: 'px-4 py-2 bg-blue-500 text-white rounded-lg font-bold hover:bg-blue-600 transition'
                                                }, 'Undo')
                                            );
                                        })
                                    )
                                ),
                                
                                h('div', { className: 'space-y-4' },
                                    // Player Selection
                                    h('div', {},
                                        h('label', { className: 'block text-sm font-bold text-gray-700 mb-2' }, 'Select Player'),
                                        h('select', {
                                            id: 'elim-player-select',
                                            className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-red-500 focus:outline-none'
                                        },
                                            h('option', { value: '' }, 'Choose player...'),
                                            ...players
                                                .filter(p => !eliminationOrder[p.id] && (!winner || parseInt(winner) !== p.id))
                                                .map(player => 
                                                    h('option', { key: player.id, value: player.id }, player.name)
                                                )
                                        )
                                    ),
                                    
                                    // Episode Selection
                                    h('div', {},
                                        h('label', { className: 'block text-sm font-bold text-gray-700 mb-2' }, 'Eliminated in Episode'),
                                        h('select', {
                                            id: 'elim-episode-select',
                                            className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-red-500 focus:outline-none'
                                        },
                                            h('option', { value: '' }, 'Choose episode...'),
                                            ...[...Array(13)].map((_, i) => {
                                                const ep = i + 1;
                                                return h('option', { key: ep, value: ep }, 
                                                    `Episode ${ep}`
                                                );
                                            })
                                        )
                                    ),
                                    
                                    // Submit Button
                                    h('button', {
                                        onClick: () => {
                                            const playerId = document.getElementById('elim-player-select').value;
                                            const episode = document.getElementById('elim-episode-select').value;
                                            
                                            if (!playerId || !episode) {
                                                alert('Please select both player and episode');
                                                return;
                                            }
                                            
                                            if (window.firebaseInitialized) {
                                                database.ref(`leagues/${activeLeagueId}/seasons/${activeSeasonId}/eliminationOrder/${playerId}`).set(parseInt(episode)).then(() => {
                                                    setShowMarkElimination(false);
                                                    alert(`Player eliminated in Episode ${episode}!`);
                                                });
                                            }
                                        },
                                        className: 'w-full px-6 py-3 bg-gradient-to-r from-red-500 to-rose-600 text-white rounded-xl font-bold hover:shadow-lg transition text-lg'
                                    }, 'Mark as Eliminated')
                                )
                            )
                        )
                    ),
                    
                    // Mark Winner Modal
                    showMarkWinner && h('div', { 
                        className: 'modal-backdrop',
                        onClick: () => setShowMarkWinner(false)
                    },
                        h('div', { 
                            className: 'modal-content',
                            onClick: (e) => e.stopPropagation(),
                            style: { maxWidth: '600px' }
                        },
                            h('div', { className: 'p-6' },
                                h('div', { className: 'flex justify-between items-center mb-6' },
                                    h('h2', { 
                                        className: 'text-3xl font-black',
                                        style: { fontFamily: '"Bebas Neue", cursive' }
                                    }, '👑 MARK WINNER'),
                                    h('button', {
                                        onClick: () => setShowMarkWinner(false),
                                        className: 'text-gray-500 hover:text-gray-700'
                                    }, h(Icons.X, { size: 28 }))
                                ),
                                
                                winner ? 
                                    h('div', { className: 'space-y-4' },
                                        h('div', { className: 'bg-yellow-50 border-2 border-yellow-400 p-4 rounded-lg' },
                                            h('p', { className: 'font-bold text-lg mb-2' }, '👑 Current Winner:'),
                                            h('p', { className: 'text-2xl font-black' }, 
                                                players.find(p => p.id === parseInt(winner))?.name || 'Unknown'
                                            )
                                        ),
                                        h('button', {
                                            onClick: () => {
                                                if (confirm('Are you sure you want to clear the current winner?')) {
                                                    if (window.firebaseInitialized) {
                                                        database.ref(`leagues/${activeLeagueId}/seasons/${activeSeasonId}/winner`).set(null).then(() => {
                                                            setShowMarkWinner(false);
                                                            alert('Winner cleared!');
                                                        });
                                                    }
                                                }
                                            },
                                            className: 'w-full px-6 py-3 bg-red-500 text-white rounded-xl font-bold hover:shadow-lg transition'
                                        }, 'Clear Winner')
                                    ) :
                                    h('div', { className: 'space-y-4' },
                                        h('div', {},
                                            h('label', { className: 'block text-sm font-bold text-gray-700 mb-2' }, 'Select Sole Survivor'),
                                            h('select', {
                                                id: 'winner-select',
                                                className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-yellow-500 focus:outline-none'
                                            },
                                                h('option', { value: '' }, 'Choose winner...'),
                                                ...players
                                                    .filter(p => !eliminationOrder[p.id])
                                                    .map(player => 
                                                        h('option', { key: player.id, value: player.id }, player.name)
                                                    )
                                            )
                                        ),
                                        
                                        h('div', { className: 'bg-purple-50 p-4 rounded-lg text-sm' },
                                            h('p', { className: 'font-bold mb-2' }, '🏆 Winner Bonus'),
                                            h('p', {}, 'The winning player\'s team will receive a +20 point bonus!')
                                        ),
                                        
                                        h('button', {
                                            onClick: () => {
                                                const playerId = document.getElementById('winner-select').value;
                                                
                                                if (!playerId) {
                                                    alert('Please select a player');
                                                    return;
                                                }
                                                
                                                if (window.firebaseInitialized) {
                                                    database.ref(`leagues/${activeLeagueId}/seasons/${activeSeasonId}/winner`).set(parseInt(playerId)).then(() => {
                                                        setShowMarkWinner(false);
                                                        alert('Winner marked! 🎉');
                                                    });
                                                }
                                            },
                                            className: 'w-full px-6 py-3 bg-gradient-to-r from-yellow-500 to-amber-500 text-white rounded-xl font-bold hover:shadow-lg transition text-lg'
                                        }, 'Mark as Sole Survivor')
                                    )
                            )
                        )
                    ),
                    
                    // Floating Side Menu Trigger Tab (Always visible on left edge when closed)
                    !showSideMenu && h('button', {
                        onClick: () => setShowSideMenu(true),
                        className: 'fixed left-0 top-1/2 -translate-y-1/2 z-40 bg-gradient-to-r from-orange-500 to-amber-600 text-white py-3 px-2 rounded-r-2xl shadow-2xl hover:pr-3.5 transition-all flex items-center gap-2 font-bold text-xs border-y border-r border-white/30 cursor-pointer group',
                        title: 'Open Leagues Menu'
                    },
                        h(Icons.Menu, { size: 18, className: 'group-hover:scale-110 transition-transform' }),
                        h('span', { className: 'hidden md:inline font-black tracking-wider text-[10px] uppercase' }, 'Leagues')
                    ),

                    // Side Menu Panel (Always docked on side when toggled, openable and closable)
                    h(Fragment, {},
                        // Overlay Backdrop
                        showSideMenu && h('div', {
                            className: 'fixed inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity',
                            onClick: () => setShowSideMenu(false)
                        }),
                        
                        // Side Menu Sidebar Panel
                        h('aside', {
                            className: `fixed top-0 left-0 bottom-0 w-80 max-w-[85vw] bg-slate-900 text-white shadow-2xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col justify-between overflow-y-auto border-r border-slate-800 ${
                                showSideMenu ? 'translate-x-0' : '-translate-x-full'
                            }`
                        },
                            h('div', { className: 'p-6' },
                                // Header
                                h('div', { className: 'flex justify-between items-center mb-6 pb-4 border-b border-slate-800' },
                                    h('div', { className: 'flex items-center gap-2.5' },
                                        h('div', { className: 'w-9 h-9 rounded-xl bg-orange-500/20 flex items-center justify-center text-orange-400 border border-orange-500/30' },
                                            h(Icons.Trophy, { size: 20 })
                                        ),
                                        h('div', {},
                                            h('h2', { className: 'text-base font-black text-white leading-tight' }, 'Leagues & Seasons'),
                                            h('p', { className: 'text-[11px] text-slate-400 font-semibold' }, 'Survivor Fantasy League')
                                        )
                                    ),
                                    h('button', {
                                        onClick: () => setShowSideMenu(false),
                                        className: 'p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition cursor-pointer'
                                    }, h(Icons.X, { size: 18 }))
                                ),

                                // Leagues & Seasons List
                                h('div', { className: 'space-y-4' },
                                    h('div', { className: 'text-[11px] font-bold text-slate-400 uppercase tracking-wider px-1' }, 'Leagues & Seasons'),
                                    Object.values(LEAGUES_DATA).map(league => {
                                        const isLeagueActive = league.id === activeLeagueId;
                                        const availableSeasons = league.seasons || [{ id: 'season-51', name: 'Season 51: Open Era', label: 'Season 51' }];
                                        
                                        return h('div', { 
                                            key: league.id, 
                                            className: `rounded-2xl p-4 transition border ${
                                                isLeagueActive 
                                                    ? 'bg-slate-800/80 border-orange-500/40 shadow-lg ring-1 ring-orange-500/20' 
                                                    : 'bg-slate-800/30 border-slate-800 hover:bg-slate-800/50'
                                            }` 
                                        },
                                            h('div', { className: 'flex items-center justify-between mb-3 pb-2 border-b border-slate-700/50' },
                                                h('div', { className: 'font-bold text-sm text-white' }, league.name),
                                                h('span', { className: 'text-[10px] font-bold text-slate-400 bg-slate-700/60 px-2 py-0.5 rounded-full' }, `${league.teams.length} Teams`)
                                            ),
                                            h('div', { className: 'space-y-1.5' },
                                                availableSeasons.map(season => {
                                                    const isSeasonActive = isLeagueActive && activeSeasonId === season.id;
                                                    return h('button', {
                                                        key: season.id,
                                                        onClick: () => {
                                                            setActiveLeagueAndSeason(league.id, season.id);
                                                        },
                                                        className: `w-full text-left px-3 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-between cursor-pointer ${
                                                            isSeasonActive
                                                                ? 'bg-gradient-to-r from-orange-500 to-amber-600 text-white font-bold shadow-md'
                                                                : 'bg-slate-900/60 text-slate-300 hover:bg-slate-700/60 hover:text-white border border-slate-700/40'
                                                        }`
                                                    },
                                                        h('div', { className: 'flex items-center gap-2' },
                                                            h('span', {}, season.status === 'current' ? '🔥' : '📜'),
                                                            h('span', {}, season.name || season.label)
                                                        ),
                                                        isSeasonActive && h(Icons.Check, { size: 14 })
                                                    );
                                                })
                                            )
                                        );
                                    })
                                )
                            ),

                            // Sidebar Footer
                            h('div', { className: 'p-4 border-t border-slate-800 bg-slate-950/60 text-center text-[11px] text-slate-500 font-semibold' },
                                h('div', { className: 'flex items-center justify-center gap-2 mb-1 text-slate-400' },
                                    h('span', { className: 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse' }),
                                    h('span', {}, `${(LEAGUES_DATA[activeLeagueId] || {}).name} • ${activeSeasonId.toUpperCase()}`)
                                ),
                                'Survivor 51 Fantasy App'
                            )
                        )
                    ),

                    // Footer
                    h('div', { className: 'mt-12 text-center text-gray-900' },
                        h('p', { className: 'text-sm text-gray-700' }, 'Survivor 51: Open Era • Scoring Tracker & Leaderboard')
                    )
                )
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(ScoringPage));
    }
    </script>
    
    <!-- PWA Service Worker -->
    <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
            .then((registration) => {
                console.log('Service Worker registered:', registration);
            })
            .catch((error) => {
                console.error('Service Worker registration failed:', error);
            });
    }

    // Detect if running as installed PWA
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running as installed PWA');
    }
    </script>
</body>
</html>
